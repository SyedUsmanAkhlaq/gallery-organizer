name: gallery_organizer
description: On-device gallery organizer (albums, clothing categories, face grouping). Personal use.
publish_to: none

# versionCode is overridden in CI with --build-number (GitHub run number), so
# every CI build installs over the previous one.
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  photo_manager: ^3.6.0
  photo_manager_image_provider: ^2.2.0
  video_player: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
