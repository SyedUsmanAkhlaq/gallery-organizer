name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to publish GitHub Releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner image does NOT ship with Flutter.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tool versions
        run: |
          flutter --version
          java -version

      - name: Verify committed signing key is readable
        run: keytool -list -keystore android/app/debug.keystore -storetype pkcs12 -storepass android -alias androiddebugkey

      # ---- Models (not in git: license terms + size). Cached by input hash. ----
      - name: Cache models
        id: models
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/models
          key: models-v1-${{ hashFiles('tools/export_models.py', 'tools/categories.yaml', 'tools/requirements.txt', 'tools/fetch_face_model.sh') }}

      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Export clothing model (MobileCLIP2-S0 → ONNX + text embeddings)
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -r tools/requirements.txt
          tools/ci/run.sh "export models" python tools/export_models.py

      - name: Fetch face recognition model
        if: steps.models.outputs.cache-hit != 'true'
        run: tools/ci/run.sh "face model" tools/fetch_face_model.sh

      - name: Check model files
        run: |
          ls -la android/app/src/main/assets/models/*/
          test -s android/app/src/main/assets/models/clothing/image_encoder.onnx
          test -s android/app/src/main/assets/models/clothing/text_embeddings.json
          test -s android/app/src/main/assets/models/face/w600k_mbf.onnx

      - name: pub get
        run: tools/ci/run.sh "pub get" flutter pub get

      # Pigeon output is not committed: generate the Dart + Kotlin bridge.
      - name: Generate Pigeon bridge
        run: tools/ci/run.sh "pigeon" dart run pigeon --input pigeons/native_api.dart

      - name: Analyze
        run: tools/ci/run.sh "analyze" flutter analyze --no-fatal-infos

      - name: Dart unit tests
        run: tools/ci/run.sh "flutter test" flutter test

      # arm64-only: every Android 13/14 phone is arm64; halves APK size once
      # the native inference libraries are added.
      - name: Build release APK
        run: >
          tools/ci/run.sh "build apk" flutter build apk --release
          --target-platform android-arm64
          --build-number ${{ github.run_number }}
          --build-name 0.1.${{ github.run_number }}

      # gradlew + local.properties exist once the Flutter build has run.
      - name: Kotlin unit tests
        working-directory: android
        run: ../tools/ci/run.sh "kotlin tests" ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/gallery-organizer.apk
          ls -la dist
          sha256sum dist/gallery-organizer.apk | tee dist/gallery-organizer.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-organizer-${{ github.run_number }}
          path: dist/

      # Stable phone-friendly URL (public repos only):
      # https://github.com/<owner>/<repo>/releases/latest/download/gallery-organizer.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/gallery-organizer.apk dist/gallery-organizer.apk.sha256 \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Build ${{ github.run_number }} ($(git rev-parse --short HEAD))" \
            --notes "Commit: ${{ github.sha }}" \
            --latest
